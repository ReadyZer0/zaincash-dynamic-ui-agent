name: Build SleepTrace Fixed APK

on:
  push:
    branches:
      - sleeptrace-apk-build-20261024
    paths-ignore:
      - 'built_apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct source
        run: |
          sha256sum sleeptrace_min/p0*
          cat sleeptrace_min/p0* | base64 -d > /tmp/SleepTrace-build-min.zip
          mkdir -p /tmp/st
          unzip -q /tmp/SleepTrace-build-min.zip -d /tmp/st
          cp sleeptrace_patch/MainActivity.java /tmp/st/app/src/main/java/com/ready/sleeptrace/MainActivity.java
          grep -q "applicationId 'com.ready.sleeptrace.fixed'" /tmp/st/app/build.gradle
      - name: Build APK
        working-directory: /tmp/st
        run: gradle --no-daemon assembleDebug
      - name: Verify and package
        run: |
          mkdir -p artifact
          cp /tmp/st/app/build/outputs/apk/debug/app-debug.apk artifact/SleepTrace-Fixed-1.0.2.apk
          sha256sum artifact/SleepTrace-Fixed-1.0.2.apk > artifact/SleepTrace-Fixed-1.0.2.apk.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs artifact/SleepTrace-Fixed-1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SleepTrace-Fixed-1.0.2
          path: artifact/*
          if-no-files-found: error

      - name: Commit APK to temporary build branch
        if: github.event_name == 'push'
        run: |
          mkdir -p built_apk
          cp artifact/SleepTrace-Fixed-1.0.2.apk built_apk/SleepTrace-Fixed-1.0.2.apk
          cp artifact/SleepTrace-Fixed-1.0.2.apk.sha256 built_apk/SleepTrace-Fixed-1.0.2.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add built_apk/
          git diff --cached --quiet || git commit -m "build: publish SleepTrace Fixed APK"
          git push origin HEAD:sleeptrace-apk-build-20261024
