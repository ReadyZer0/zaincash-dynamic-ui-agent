name: Build SleepTrace Fixed APK

on:
  push:
    branches:
      - sleeptrace-apk-build-20261024
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Reconstruct source
        run: |
          cat sleeptrace_min/p0* | base64 -d > /tmp/SleepTrace-build-min.zip
          mkdir -p /tmp/st
          unzip -q /tmp/SleepTrace-build-min.zip -d /tmp/st
          grep -q "applicationId 'com.ready.sleeptrace.fixed'" /tmp/st/app/build.gradle
      - name: Build APK
        working-directory: /tmp/st
        run: gradle --no-daemon assembleDebug
      - name: Verify and package
        run: |
          mkdir -p artifact
          cp /tmp/st/app/build/outputs/apk/debug/app-debug.apk artifact/SleepTrace-Fixed-1.0.2.apk
          sha256sum artifact/SleepTrace-Fixed-1.0.2.apk > artifact/SleepTrace-Fixed-1.0.2.apk.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs artifact/SleepTrace-Fixed-1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SleepTrace-Fixed-1.0.2
          path: artifact/*
          if-no-files-found: error
